services:
  nginx:
    image: nginx:alpine
    container_name: engineeros-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - engineeros-net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: engineeros-api
    command: ["node", "src/server.js"]
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/engineeros?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=local-dev-jwt-access-secret-minimum-32-chars-long
      - JWT_REFRESH_SECRET=local-dev-jwt-refresh-secret-minimum-32-chars-long
      - CODE_EXEC_PROVIDER=judge0
      - JUDGE0_API_URL=http://judge0-stub:2358
      - LLM_PROVIDER=mock
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - engineeros-net

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: engineeros-worker
    command: ["node", "src/worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/engineeros?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - CODE_EXEC_PROVIDER=judge0
      - JUDGE0_API_URL=http://judge0-stub:2358
      - LLM_PROVIDER=mock
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - engineeros-net

  mongo:
    image: mongo:7.0
    container_name: engineeros-mongo
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - engineeros-net

  mongo-init:
    image: mongo:7.0
    container_name: engineeros-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval "
        try {
          rs.status();
          print('Replica set rs0 already initialized');
        } catch (e) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
          print('Replica set rs0 initiated successfully');
        }
      "
    networks:
      - engineeros-net

  redis:
    image: redis:7-alpine
    container_name: engineeros-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - engineeros-net

  judge0-stub:
    build:
      context: ./judge0-stub
      dockerfile: Dockerfile
    container_name: engineeros-judge0-stub
    ports:
      - "2358:2358"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2358/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - engineeros-net

volumes:
  mongo_data:
  redis_data:

networks:
  engineeros-net:
    driver: bridge
