services:
  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID:-}
    container_name: engineeros-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - engineeros-net

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: engineeros-api
    restart: unless-stopped
    command: ["node", "src/server.js"]
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - MONGODB_URI=mongodb://mongo:27017/engineeros?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-engineeros-docker-compose-access-secret-key-2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-engineeros-docker-compose-refresh-secret-key-2026}
      - COOKIE_SECRET=${COOKIE_SECRET:-engineeros-docker-compose-cookie-secret-key-2026}
      - CODE_EXEC_PROVIDER=judge0
      - JUDGE0_API_URL=http://judge0-stub:2358
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=./uploads
    volumes:
      - uploads_data:/app/server/uploads
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - engineeros-net

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: engineeros-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/engineeros?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-engineeros-docker-compose-access-secret-key-2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-engineeros-docker-compose-refresh-secret-key-2026}
      - COOKIE_SECRET=${COOKIE_SECRET:-engineeros-docker-compose-cookie-secret-key-2026}
      - CODE_EXEC_PROVIDER=judge0
      - JUDGE0_API_URL=http://judge0-stub:2358
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=./uploads
    volumes:
      - uploads_data:/app/server/uploads
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - engineeros-net

  mongo:
    image: mongo:7.0
    container_name: engineeros-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - engineeros-net

  mongo-init:
    image: mongo:7.0
    container_name: engineeros-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval "
        try {
          rs.status();
          print('Replica set rs0 already initialized');
        } catch (e) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
          print('Replica set rs0 initiated successfully');
        }
      "
    networks:
      - engineeros-net

  redis:
    image: redis:7-alpine
    container_name: engineeros-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - engineeros-net

  judge0-stub:
    build:
      context: ./judge0-stub
      dockerfile: Dockerfile
    container_name: engineeros-judge0-stub
    restart: unless-stopped
    ports:
      - "2358:2358"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2358/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - engineeros-net

volumes:
  mongo_data:
  redis_data:
  uploads_data:

networks:
  engineeros-net:
    driver: bridge
