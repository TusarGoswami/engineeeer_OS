<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Background glow -->
  <ellipse cx="200" cy="420" rx="120" ry="20" fill="#FF6500" opacity="0.08"/>

  <!-- Monitor / Screen body -->
  <rect x="80" y="80" width="240" height="180" rx="16" fill="#15171B" stroke="#30333A" stroke-width="2"/>
  <rect x="92" y="92" width="216" height="156" rx="10" fill="#101216"/>

  <!-- Screen content - code lines -->
  <rect x="108" y="112" width="80" height="6" rx="3" fill="#FF6500" opacity="0.9"/>
  <rect x="108" y="126" width="130" height="5" rx="2.5" fill="#A1A1AA" opacity="0.5"/>
  <rect x="118" y="140" width="100" height="5" rx="2.5" fill="#A1A1AA" opacity="0.35"/>
  <rect x="118" y="154" width="60" height="5" rx="2.5" fill="#60a5fa" opacity="0.6"/>
  <rect x="108" y="168" width="90" height="5" rx="2.5" fill="#A1A1AA" opacity="0.5"/>
  <rect x="118" y="182" width="110" height="5" rx="2.5" fill="#A1A1AA" opacity="0.35"/>
  <rect x="118" y="196" width="50" height="5" rx="2.5" fill="#10b981" opacity="0.6"/>
  <rect x="108" y="210" width="70" height="5" rx="2.5" fill="#A1A1AA" opacity="0.4"/>

  <!-- Cursor blink -->
  <rect x="186" y="210" width="8" height="5" rx="1" fill="#FF6500" opacity="0.85"/>

  <!-- Monitor stand neck -->
  <rect x="186" y="260" width="28" height="40" rx="4" fill="#22252B"/>

  <!-- Monitor stand base -->
  <rect x="140" y="295" width="120" height="16" rx="8" fill="#22252B"/>

  <!-- Robot head -->
  <rect x="140" y="20" width="120" height="88" rx="24" fill="#1a1d22" stroke="#30333A" stroke-width="1.5"/>

  <!-- Eyes -->
  <rect x="162" y="44" width="28" height="20" rx="8" fill="#101216"/>
  <rect x="210" y="44" width="28" height="20" rx="8" fill="#101216"/>
  <!-- Eye glow -->
  <rect x="166" y="48" width="20" height="12" rx="5" fill="#FF6500" opacity="0.9"/>
  <rect x="214" y="48" width="20" height="12" rx="5" fill="#FF6500" opacity="0.9"/>
  <!-- Eye reflection -->
  <circle cx="171" cy="51" r="3" fill="white" opacity="0.7"/>
  <circle cx="219" cy="51" r="3" fill="white" opacity="0.7"/>

  <!-- Mouth / smile -->
  <path d="M 168 82 Q 200 98 232 82" stroke="#30333A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Antenna -->
  <line x1="200" y1="20" x2="200" y2="4" stroke="#30333A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="4" r="5" fill="#FF6500"/>

  <!-- Arms -->
  <rect x="80" y="100" width="60" height="20" rx="10" fill="#1a1d22" stroke="#30333A" stroke-width="1.5"/>
  <rect x="260" y="100" width="60" height="20" rx="10" fill="#1a1d22" stroke="#30333A" stroke-width="1.5"/>

  <!-- Left hand holding coffee -->
  <circle cx="72" cy="110" r="12" fill="#22252B" stroke="#30333A" stroke-width="1.5"/>
  <rect x="64" y="102" width="16" height="20" rx="4" fill="#101216"/>
  <path d="M 80 108 Q 90 108 90 116 Q 90 124 80 124" stroke="#30333A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M 68 100 Q 70 94 68 88" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 76 100 Q 78 93 76 86" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Right hand holding wrench/gear -->
  <circle cx="328" cy="110" r="12" fill="#22252B" stroke="#30333A" stroke-width="1.5"/>
  <!-- Simple gear icon -->
  <circle cx="328" cy="110" r="6" stroke="#FF6500" stroke-width="2" fill="none" opacity="0.9"/>
  <circle cx="328" cy="110" r="2.5" fill="#FF6500" opacity="0.7"/>

  <!-- Decorative floating elements -->
  <!-- Small code bracket top right -->
  <text x="330" y="55" font-family="monospace" font-size="18" fill="#FF6500" opacity="0.3">{}</text>
  <!-- Small dots bottom left -->
  <circle cx="60" cy="340" r="3" fill="#FF6500" opacity="0.2"/>
  <circle cx="72" cy="348" r="2" fill="#FF6500" opacity="0.15"/>
  <circle cx="52" cy="354" r="2" fill="#FF6500" opacity="0.1"/>

  <!-- Small binary numbers decoration -->
  <text x="310" y="310" font-family="monospace" font-size="10" fill="#A1A1AA" opacity="0.2">01</text>
  <text x="318" y="324" font-family="monospace" font-size="10" fill="#A1A1AA" opacity="0.15">10</text>
</svg>

